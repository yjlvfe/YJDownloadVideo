name: Direct Main Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/direct-main-repair-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply deterministic production fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/acceptance_media.py",
              "from urllib.parse import urlparse\n",
              "from urllib.parse import urljoin, urlparse\n",
          )
          replace_once(
              "scripts/acceptance_media.py",
              '''def _json(response: httpx.Response) -> dict[str, Any]:\n''',
              '''def absolute_download_url(base_url: str, value: str) -> str:\n    candidate = str(value or "").strip()\n    if not candidate:\n        return ""\n    return urljoin(f"{base_url.rstrip('/')}/", candidate)\n\n\ndef _json(response: httpx.Response) -> dict[str, Any]:\n''',
          )
          replace_once(
              "scripts/acceptance_media.py",
              '''                    download_url = str(job.get("download_url") or "")\n                    if not download_url:\n                        raise RuntimeError("ready job has no download URL")\n''',
              '''                    download_url = absolute_download_url(\n                        base_url,\n                        str(job.get("download_url") or ""),\n                    )\n                    if not download_url:\n                        raise RuntimeError("ready job has no download URL")\n''',
          )

          replace_once(
              "app/extractor.py",
              '''def _ytdlp_headers() -> dict:\n''',
              '''def _browser_capture_url(url: str) -> str:\n    host = (urlparse(str(url or "")).hostname or "").lower()\n    if host == "youtu.be" or host.endswith("youtube.com"):\n        match = re.search(\n            r"(?:v=|shorts/|youtu\\.be/|embed/|live/)([A-Za-z0-9_-]{11})",\n            str(url),\n        )\n        if match:\n            video_id = match.group(1)\n            return (\n                f"https://www.youtube.com/embed/{video_id}"\n                "?autoplay=1&playsinline=1&controls=1"\n            )\n    return url\n\n\ndef _ytdlp_headers() -> dict:\n''',
          )
          replace_once(
              "app/extractor.py",
              '''        except DownloadError as de:\n            # يوتيوب محجوب من الخادم (فحص روبوت)؟ جرّب الخوادم البديلة قبل الاستسلام\n            if not (self._is_youtube(url) and not self.cookies_file):\n                raise\n            try:\n                return self._download_yt_fallback(url, outdir, preferred)\n            except DownloadError:\n                raise de\n''',
              '''        except DownloadError as de:\n            first_err = str(de)[:200]\n            if not (self._is_youtube(url) and not self.cookies_file):\n                raise\n            try:\n                return self._download_yt_fallback(url, outdir, preferred)\n            except DownloadError as fallback_error:\n                first_err = f"{first_err} / {str(fallback_error)[:120]}"\n            # A blocked yt-dlp request must not suppress the independent HTML/CDP\n            # layers. Public YouTube embeds can still expose a playable media\n            # request from the same Render egress and browser session.\n''',
          )
          replace_once(
              "app/extractor.py",
              '''    def _capture_browser(self, url: str, wait_quiet: float = 6.0, max_wait: float = 35.0) -> list[MediaCandidate]:\n        """يفتح الصفحة في Chromium هيدلس ويلتقط طلبات الوسائط من الشبكة."""\n        from websockets.sync.client import connect\n''',
              '''    def _capture_browser(self, url: str, wait_quiet: float = 6.0, max_wait: float = 35.0) -> list[MediaCandidate]:\n        """يفتح الصفحة في Chromium هيدلس ويلتقط طلبات الوسائط من الشبكة."""\n        from websockets.sync.client import connect\n\n        capture_url = _browser_capture_url(url)\n''',
          )
          replace_once(
              "app/extractor.py",
              '''                f"http://127.0.0.1:{port}/json/new?{url}",\n''',
              '''                f"http://127.0.0.1:{port}/json/new?{capture_url}",\n''',
          )
          replace_once(
              "app/extractor.py",
              '''                send(ws, mid := mid + 1, "Page.navigate", {"url": url})\n''',
              '''                send(ws, mid := mid + 1, "Page.navigate", {"url": capture_url})\n''',
          )

          replace_once(
              "app/platform_runtime.py",
              '''def _safe_ytdlp_logger() -> SafeYtdlpLogger:\n''',
              '''def _trusted_googlevideo_candidate(candidate: Any) -> bool:\n    source = str(getattr(candidate, "source", "") or "").lower()\n    cookies_file = str(getattr(candidate, "cookies_file", "") or "").strip()\n    return source in {"cdp", "cdp-dom"} and bool(cookies_file)\n\n\ndef _safe_ytdlp_logger() -> SafeYtdlpLogger:\n''',
          )
          replace_once(
              "app/platform_runtime.py",
              '''        if _is_googlevideo_url(str(candidate.url)):\n            raise DownloadError(FRAGMENT_FORBIDDEN)\n''',
              '''        if (\n            _is_googlevideo_url(str(candidate.url))\n            and not _trusted_googlevideo_candidate(candidate)\n        ):\n            raise DownloadError(FRAGMENT_FORBIDDEN)\n''',
          )

          Path("tests/test_direct_main_repair.py").write_text(
              '''from pathlib import Path\nfrom types import SimpleNamespace\n\nimport app.extractor as extractor_module\nfrom app.extractor import DownloadError, MediaCandidate, UniversalExtractor, _browser_capture_url\nfrom app.platform_runtime import _trusted_googlevideo_candidate\nfrom scripts.acceptance_media import absolute_download_url\n\n\ndef test_acceptance_absolutizes_relative_download_url():\n    assert absolute_download_url(\n        "https://worker.example", "/download/token"\n    ) == "https://worker.example/download/token"\n\n\ndef test_acceptance_preserves_absolute_download_url():\n    assert absolute_download_url(\n        "https://worker.example", "https://cdn.example/file.mp4"\n    ) == "https://cdn.example/file.mp4"\n\n\ndef test_youtube_browser_capture_uses_autoplay_embed():\n    assert _browser_capture_url(\n        "https://youtube.com/shorts/T7DA7VTZ_Zs?feature=share"\n    ) == (\n        "https://www.youtube.com/embed/T7DA7VTZ_Zs"\n        "?autoplay=1&playsinline=1&controls=1"\n    )\n    assert _browser_capture_url("https://vm.tiktok.com/example/") == (\n        "https://vm.tiktok.com/example/"\n    )\n\n\ndef test_googlevideo_requires_same_browser_session_cookie():\n    trusted = SimpleNamespace(\n        source="cdp",\n        cookies_file="/tmp/browser-cookies.txt",\n    )\n    untrusted = SimpleNamespace(source="js-blob", cookies_file="")\n    assert _trusted_googlevideo_candidate(trusted) is True\n    assert _trusted_googlevideo_candidate(untrusted) is False\n\n\ndef test_youtube_download_continues_to_browser_after_ytdlp_block(monkeypatch, tmp_path):\n    media_path = tmp_path / "captured.mp4"\n    media_path.write_bytes(b"media")\n    candidate = MediaCandidate(\n        "https://example.invalid/captured.mp4",\n        "direct",\n        "cdp",\n        cookies_file="/tmp/browser-cookies.txt",\n    )\n    extractor = UniversalExtractor(use_browser=False)\n\n    monkeypatch.setattr(\n        extractor,\n        "_download_ytdlp",\n        lambda *args, **kwargs: (_ for _ in ()).throw(DownloadError("youtube_circuit_open")),\n    )\n    monkeypatch.setattr(\n        extractor,\n        "_download_yt_fallback",\n        lambda *args, **kwargs: (_ for _ in ()).throw(DownloadError("fallback disabled")),\n    )\n    monkeypatch.setattr(\n        extractor,\n        "discover",\n        lambda *args, **kwargs: {"title": "captured", "candidates": [candidate]},\n    )\n    monkeypatch.setattr(\n        extractor,\n        "_download_candidate",\n        lambda *args, **kwargs: {\n            "path": str(media_path),\n            "title": "captured",\n            "duration": 1,\n            "thumbnail": "",\n            "ext": "mp4",\n        },\n    )\n    monkeypatch.setattr(extractor_module, "_has_audio", lambda path: True)\n    monkeypatch.setattr(extractor_module, "_has_video", lambda path: True)\n\n    result = extractor.download(\n        "https://youtube.com/shorts/T7DA7VTZ_Zs",\n        tmp_path,\n        "best",\n    )\n    assert result["path"] == str(media_path)\n''',
              encoding="utf-8",
          )
          PY
      - name: Install and verify
        run: |
          pip install -r requirements.txt pip-audit
          pip-audit -r requirements.txt
          PYTHONPATH=. pytest -q
          PYTHONPATH=. python -m compileall -q app scripts
          docker build --tag yjdownload:direct-main-gate .
      - name: Commit verified repair directly to main
        shell: bash
        run: |
          rm -f .github/direct-main-repair-trigger
          rm -f .github/workflows/direct-main-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete live media recovery on main"
          git push origin HEAD:main
