name: Direct YouTube Browser Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/direct-youtube-browser-repair-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply YouTube browser candidate repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/extractor.py")
          text = path.read_text(encoding="utf-8")
          old = '''        # L2: مسح HTML\n        try:\n            cands, meta = self._scan_html(url)\n            if cands:\n                return {"source": "html-scan", "title": meta.get("title", ""),\n                        "thumbnail": meta.get("thumbnail", ""), "duration": None,\n                        "candidates": cands}\n        except Exception as e:  # noqa: BLE001\n            errors.append(f"html-scan: {str(e)[:120]}")\n'''
          new = '''        # L2: مسح HTML\n        try:\n            cands, meta = self._scan_html(url)\n            if cands:\n                source = "html-scan"\n                if self._is_youtube(url) and self.use_browser:\n                    try:\n                        browser_candidates = self._capture_browser(url)\n                    except Exception as browser_error:  # noqa: BLE001\n                        errors.append(f"browser: {str(browser_error)[:120]}")\n                        browser_candidates = []\n                    if browser_candidates:\n                        source = "browser+html"\n                        seen = {candidate.url for candidate in browser_candidates}\n                        cands = browser_candidates + [\n                            candidate for candidate in cands if candidate.url not in seen\n                        ]\n                return {"source": source, "title": meta.get("title", ""),\n                        "thumbnail": meta.get("thumbnail", ""), "duration": None,\n                        "candidates": cands}\n        except Exception as e:  # noqa: BLE001\n            errors.append(f"html-scan: {str(e)[:120]}")\n'''
          if text.count(old) != 1:
              raise SystemExit(f"discover block match count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_direct_main_repair.py")
          tests = test_path.read_text(encoding="utf-8")
          addition = '''\n\ndef test_youtube_discover_prefers_browser_session_candidates(monkeypatch):\n    extractor = UniversalExtractor(use_browser=True)\n    html_candidate = MediaCandidate(\n        "https://r.example.googlevideo.com/videoplayback?itag=18",\n        "direct",\n        "js-blob",\n    )\n    browser_candidate = MediaCandidate(\n        "https://r.example.googlevideo.com/videoplayback?itag=22",\n        "direct",\n        "cdp",\n        cookies_file="/tmp/browser-cookies.txt",\n    )\n    monkeypatch.setattr(\n        extractor,\n        "_ytdlp_info",\n        lambda *args, **kwargs: (_ for _ in ()).throw(DownloadError("blocked")),\n    )\n    monkeypatch.setattr(\n        extractor,\n        "_scan_html",\n        lambda *args, **kwargs: ([html_candidate], {"title": "video", "thumbnail": ""}),\n    )\n    monkeypatch.setattr(\n        extractor,\n        "_capture_browser",\n        lambda *args, **kwargs: [browser_candidate],\n    )\n\n    result = extractor.discover("https://youtube.com/watch?v=kTRs4ycFp_o")\n    assert result["source"] == "browser+html"\n    assert result["candidates"][0] is browser_candidate\n    assert result["candidates"][1] is html_candidate\n'''
          if "test_youtube_discover_prefers_browser_session_candidates" in tests:
              raise SystemExit("test already exists")
          test_path.write_text(tests + addition, encoding="utf-8")
          PY
      - name: Verify complete release gate
        run: |
          pip install -r requirements.txt pip-audit
          pip-audit -r requirements.txt
          PYTHONPATH=. pytest -q
          PYTHONPATH=. python -m compileall -q app scripts
          docker build --tag yjdownload:youtube-browser-gate .
      - name: Commit verified repair directly to main
        shell: bash
        run: |
          rm -f .github/direct-youtube-browser-repair-trigger
          rm -f .github/workflows/direct-youtube-browser-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prefer trusted browser media for YouTube"
          git push origin HEAD:main
