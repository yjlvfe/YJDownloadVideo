services:
  warp:
    image: land007/warp-v2ray:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      CONFIG_MODE: patch
      WARP_PROTOCOL: MASQUE
      WARP_MODE: warp
      XRAY_PORT: "9001"
    volumes:
      - warp_data:/var/lib/cloudflare-warp
      - warp_config:/config

  web:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      YTDLP_PROXY: http://warp:9002
      MAX_FRAGMENT_CONNECTIONS_PER_JOB: "32"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./storage:/app/storage
    depends_on:
      warp:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      YTDLP_PROXY: http://warp:9002
      MAX_FRAGMENT_CONNECTIONS_PER_JOB: "32"
    command: python -m app.worker
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./storage:/app/storage
    depends_on:
      warp:
        condition: service_started
      redis:
        condition: service_healthy

  bot:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      YTDLP_PROXY: http://warp:9002
      MAX_FRAGMENT_CONNECTIONS_PER_JOB: "32"
    command: python -m app.bot
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./storage:/app/storage
    depends_on:
      warp:
        condition: service_started
      redis:
        condition: service_healthy

  cleanup:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      YTDLP_PROXY: http://warp:9002
      MAX_FRAGMENT_CONNECTIONS_PER_JOB: "32"
    command: python -m app.cleanup
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./storage:/app/storage
    depends_on:
      warp:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data_novpn:/data

  tba:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - tba_data_novpn:/var/lib/telegram-bot-api

volumes:
  redis_data_novpn:
  warp_data:
  warp_config:
  tba_data_novpn:
