name: Vercel Media Flow

on:
  push:
    branches:
      - main
      - fix/vercel-only-media-choice-20260803
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test Vercel-only flow
        run: >-
          pytest -q
          tests/test_vercel_media_flow.py
          tests/test_vercel_runtime.py
          tests/test_vercel_only_main.py
          tests/test_vercel_only_config.py
      - name: Compile application
        run: python -m compileall -q app
