name: Repository Test Suite

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and audit Node runtime
        run: |
          npm install --ignore-scripts
          npm audit --omit=dev --audit-level=high
          node scripts/youtube_innertube.mjs self-test
      - name: Install development dependencies and audit tool
        run: pip install -r requirements-dev.txt pip-audit
      - name: Audit production Python dependencies
        run: pip-audit -r requirements-runtime.txt
      - name: Scan tracked text files for secret-shaped values
        run: python scripts/check_tracked_secrets.py
      - name: Run complete test suite
        run: PYTHONPATH=. pytest -q
      - name: Compile application and operational scripts
        run: PYTHONPATH=. python -m compileall -q app scripts
      - name: Build tested Docker stage
        shell: bash
        run: |
          set -o pipefail
          docker build --target test --progress=plain --tag yjdownload:test . 2>&1 | tee docker-test-build.log
      - name: Build production Docker runtime
        shell: bash
        run: |
          set -o pipefail
          docker build --target runtime --progress=plain --tag yjdownload:release-gate . 2>&1 | tee docker-runtime-build.log
          docker run --rm --entrypoint /opt/venv/bin/python yjdownload:release-gate -c "import importlib.util; assert importlib.util.find_spec('pytest') is None"
      - name: Upload Docker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-logs
          path: |
            docker-test-build.log
            docker-runtime-build.log
          if-no-files-found: ignore
          retention-days: 3
