name: Direct GoogleVideo Stream Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/direct-googlevideo-stream-repair-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply deterministic stream and quality fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/platform_runtime.py",
              '''def _trusted_googlevideo_candidate(candidate: Any) -> bool:\n    source = str(getattr(candidate, "source", "") or "").lower()\n    cookies_file = str(getattr(candidate, "cookies_file", "") or "").strip()\n    return source in {"cdp", "cdp-dom"} and bool(cookies_file)\n''',
              '''def _trusted_googlevideo_candidate(candidate: Any) -> bool:\n    source = str(getattr(candidate, "source", "") or "").lower()\n    # A CDP URL was observed live by Chromium on the same Render instance and\n    # egress identity. The signed URL itself can be sufficient even when the\n    # public embed creates no persistent cookie file. HTML/JS scraped URLs\n    # remain blocked because they were not observed in the active session.\n    return source in {"cdp", "cdp-dom"}\n''',
          )

          extractor = Path("app/extractor.py")
          text = extractor.read_text(encoding="utf-8")

          text = text.replace(
              'COMBINED_ITAGS = {18, 22, 37, 59}\n',
              '''COMBINED_ITAGS = {18, 22, 37, 59}\nYOUTUBE_ITAG_HEIGHTS = {\n    18: 360, 22: 720, 37: 1080, 59: 480,\n    160: 144, 133: 240, 134: 360, 135: 480, 136: 720, 137: 1080,\n    278: 144, 242: 240, 243: 360, 244: 480, 247: 720, 248: 1080,\n    394: 144, 395: 240, 396: 360, 397: 480, 398: 720, 399: 1080,\n    400: 1440, 401: 2160, 302: 720, 303: 1080, 308: 1440, 315: 2160,\n}\n''',
              1,
          )

          old_inspect_tail = '''        except Exception:  # noqa: BLE001\n            pass\n        d = self.discover(url, skip_ytdlp=True)\n        return {"source": d.get("source"), "title": d.get("title"),\n                "thumbnail": d.get("thumbnail"), "duration": d.get("duration"),\n                "formats": presets}\n'''
          new_inspect_tail = '''        except Exception:  # noqa: BLE001\n            pass\n        if self._is_youtube(url):\n            try:\n                return self._inspect_yt_fallback(url)\n            except DownloadError:\n                pass\n        d = self.discover(url, skip_ytdlp=True)\n        heights = sorted({\n            int(candidate.height)\n            for candidate in (d.get("candidates") or [])\n            if int(getattr(candidate, "height", 0) or 0) > 0\n        }, reverse=True)\n        actual_formats = [{"id": "best", "label": "الأفضل تلقائيًا", "size": None}]\n        actual_formats.extend(\n            {"id": str(height), "label": f"{height}p", "size": None}\n            for height in heights\n        )\n        return {"source": d.get("source"), "title": d.get("title"),\n                "thumbnail": d.get("thumbnail"), "duration": d.get("duration"),\n                "formats": actual_formats if heights else [{\n                    "id": "best", "label": "الأفضل تلقائيًا", "size": None\n                }]}\n'''
          if text.count(old_inspect_tail) != 1:
              raise SystemExit(f"inspect tail matches={text.count(old_inspect_tail)}")
          text = text.replace(old_inspect_tail, new_inspect_tail, 1)

          method_anchor = '''    def _download_yt_fallback(self, url: str, outdir: Path, preferred: str) -> dict:\n'''
          inspect_fallback = '''    def _inspect_yt_fallback(self, url: str) -> dict:\n        """Read real formats through configured public YouTube frontends."""\n        from .config import settings\n        from yt_dlp import YoutubeDL\n\n        if not settings.enable_public_youtube_fallback:\n            raise DownloadError("public youtube fallback disabled")\n        match = re.search(r"(?:v=|shorts/|youtu\\.be/|embed/|live/)([A-Za-z0-9_-]{11})", url)\n        if not match:\n            raise DownloadError("لا يمكن تحديد معرّف يوتيوب")\n        video_id = match.group(1)\n        last_error = "no public frontend available"\n        for host in ("yewtu.be", "invidious.nerdvpn.de", "piped.video"):\n            alternative = f"https://{host}/watch?v={video_id}"\n            try:\n                options = self._base_ytdlp_opts(Path(tempfile.gettempdir()), "best")\n                options["skip_download"] = True\n                options.pop("outtmpl", None)\n                options.pop("progress_hooks", None)\n                options.pop("postprocessors", None)\n                with YoutubeDL(options) as ydl:\n                    info = ydl.extract_info(alternative, download=False)\n                if not isinstance(info, dict):\n                    raise DownloadError("public frontend returned no metadata")\n                heights = sorted({\n                    int(fmt.get("height") or 0)\n                    for fmt in (info.get("formats") or [])\n                    if fmt.get("vcodec") != "none" and int(fmt.get("height") or 0) > 0\n                }, reverse=True)\n                formats = [{"id": "best", "label": "الأفضل تلقائيًا", "size": None}]\n                formats.extend(\n                    {"id": str(height), "label": f"{height}p", "size": None}\n                    for height in heights\n                )\n                return {\n                    "source": "youtube-public-frontend",\n                    "title": info.get("title") or video_id,\n                    "thumbnail": info.get("thumbnail") or "",\n                    "duration": info.get("duration"),\n                    "formats": formats,\n                }\n            except Exception as exc:  # noqa: BLE001\n                last_error = f"{host}: {str(exc)[:120]}"\n        raise DownloadError(f"public YouTube inspection failed: {last_error}")\n\n'''
          if text.count(method_anchor) != 1:
              raise SystemExit(f"fallback method anchor matches={text.count(method_anchor)}")
          text = text.replace(method_anchor, inspect_fallback + method_anchor, 1)

          old_loop = '''                    res = self._download_candidate(cand, outdir, referer=url)\n                    if best_res is None:\n                        best_res = res\n                    ok_audio = _has_audio(res["path"])\n                    ok_video = preferred == "audio" or _has_video(res["path"])\n'''
          new_loop = '''                    res = self._download_candidate(cand, outdir, referer=url)\n                    if preferred == "audio":\n                        res = self._convert_to_audio_only(res, outdir)\n                    if best_res is None:\n                        best_res = res\n                    ok_audio = _has_audio(res["path"])\n                    ok_video = preferred == "audio" or _has_video(res["path"])\n'''
          if text.count(old_loop) != 1:
              raise SystemExit(f"candidate loop matches={text.count(old_loop)}")
          text = text.replace(old_loop, new_loop, 1)

          helper_anchor = '''    def _pick_best(self, cands: list[MediaCandidate]) -> MediaCandidate:\n'''
          audio_helper = '''    def _convert_to_audio_only(self, result: dict, outdir: Path) -> dict:\n        source = Path(str(result.get("path") or ""))\n        if not source.is_file() or not _has_audio(source):\n            raise DownloadError("المصدر لا يحتوي على صوت")\n        if not _has_video(source):\n            return result\n        target = Path(outdir) / f"{source.stem}_audio.m4a"\n        command = [\n            ffmpeg_location(), "-y", "-i", str(source), "-vn",\n            "-c:a", "aac", "-b:a", "192k", str(target),\n        ]\n        completed = subprocess.run(\n            command, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True\n        )\n        if completed.returncode != 0 or not target.is_file():\n            raise DownloadError("تعذر استخراج الصوت من المقطع")\n        source.unlink(missing_ok=True)\n        updated = dict(result)\n        updated["path"] = str(target)\n        updated["ext"] = "m4a"\n        return updated\n\n'''
          if text.count(helper_anchor) != 1:
              raise SystemExit(f"audio helper anchor matches={text.count(helper_anchor)}")
          text = text.replace(helper_anchor, audio_helper + helper_anchor, 1)

          old_score = '''            cands.append(MediaCandidate(\n                url=murl, kind=_guess_kind(murl), source="cdp",\n                title=urlparse(url).netloc, height=m["height"],\n                size=m["size"], score=110 + m["size"] // (1024 * 1024),  # أكبر = أفضل\n                cookies_file=cookies_file))\n'''
          new_score = '''            itag_match = re.search(r"[?&]itag=(\\d+)", murl)\n            itag = int(itag_match.group(1)) if itag_match else 0\n            height = int(m["height"] or YOUTUBE_ITAG_HEIGHTS.get(itag, 0))\n            combined_bonus = 200 if itag in COMBINED_ITAGS else 0\n            cands.append(MediaCandidate(\n                url=murl, kind=_guess_kind(murl), source="cdp",\n                title=urlparse(url).netloc, height=height,\n                size=m["size"],\n                score=110 + combined_bonus + m["size"] // (1024 * 1024),\n                cookies_file=cookies_file))\n'''
          if text.count(old_score) != 1:
              raise SystemExit(f"CDP score block matches={text.count(old_score)}")
          text = text.replace(old_score, new_score, 1)

          stream_pattern = re.compile(
              r'''        try:\n            with httpx\.stream\("GET", cand\.url, headers=headers, follow_redirects=True,\n                              timeout=60\) as r:\n                r\.raise_for_status\(\)\n                ctype = \(r\.headers\.get\("content-type"\) or ""\)\.lower\(\)\n                if ctype and not \(ctype\.startswith\("video/"\) or ctype in \(\n                        "application/octet-stream", "application/x-mpegurl",\n                        "application/vnd\.apple\.mpegurl", "binary/octet-stream"\)\):\n                    raise DownloadError\(f"الرابط لم يُرجع فيديو \(Content-Type: \{ctype\}\)"\)\n                total = int\(r\.headers\.get\("content-length"\) or 0\)\n                if self\.max_filesize and total > self\.max_filesize:\n                    raise DownloadError\("حجم الفيديو يتجاوز الحد المسموح"\)\n                n = 0\n            with open\(dest, "wb"\) as f:\n                for chunk in r\.iter_bytes\(65536\):\n                    f\.write\(chunk\)\n                    n \+= len\(chunk\)\n                    if self\.progress_hook:\n                        try:\n                            self\.progress_hook\(\{"status": "downloading",\n                                                "downloaded_bytes": n,\n                                                "total_bytes": total or None\}\)\n                        except Exception:  # noqa: BLE001\n                            pass\n'''
          )
          replacement = '''        try:\n            with httpx.stream("GET", cand.url, headers=headers, follow_redirects=True,\n                              timeout=60) as r:\n                r.raise_for_status()\n                ctype = (r.headers.get("content-type") or "").lower()\n                if ctype and not (ctype.startswith(("video/", "audio/")) or ctype in (\n                        "application/octet-stream", "application/x-mpegurl",\n                        "application/vnd.apple.mpegurl", "binary/octet-stream")):\n                    raise DownloadError(f"الرابط لم يُرجع وسائط (Content-Type: {ctype})")\n                total = int(r.headers.get("content-length") or 0)\n                if self.max_filesize and total > self.max_filesize:\n                    raise DownloadError("حجم الفيديو يتجاوز الحد المسموح")\n                n = 0\n                with open(dest, "wb") as f:\n                    for chunk in r.iter_bytes(65536):\n                        f.write(chunk)\n                        n += len(chunk)\n                        if self.progress_hook:\n                            try:\n                                self.progress_hook({"status": "downloading",\n                                                    "downloaded_bytes": n,\n                                                    "total_bytes": total or None})\n                            except Exception:  # noqa: BLE001\n                                pass\n'''
          text, count = stream_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"direct stream block matches={count}")

          old_hint = '''def _hint_height(url: str) -> int:\n    m = re.search(r"[/_-](\\d{3,4})[pP](?![0-9])", url)\n    if m:\n        return int(m.group(1))\n    return 0\n'''
          new_hint = '''def _hint_height(url: str) -> int:\n    itag_match = re.search(r"[?&]itag=(\\d+)", url)\n    if itag_match:\n        mapped = YOUTUBE_ITAG_HEIGHTS.get(int(itag_match.group(1)), 0)\n        if mapped:\n            return mapped\n    match = re.search(r"[/_-](\\d{3,4})[pP](?![0-9])", url)\n    if match:\n        return int(match.group(1))\n    return 0\n'''
          if text.count(old_hint) != 1:
              raise SystemExit(f"hint height matches={text.count(old_hint)}")
          text = text.replace(old_hint, new_hint, 1)
          extractor.write_text(text, encoding="utf-8")

          tests_path = Path("tests/test_direct_main_repair.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = tests.replace(
              '''def test_googlevideo_requires_same_browser_session_cookie():\n    trusted = SimpleNamespace(\n        source="cdp",\n        cookies_file="/tmp/browser-cookies.txt",\n    )\n    untrusted = SimpleNamespace(source="js-blob", cookies_file="")\n    assert _trusted_googlevideo_candidate(trusted) is True\n    assert _trusted_googlevideo_candidate(untrusted) is False\n''',
              '''def test_googlevideo_requires_live_browser_capture_not_cookie_file():\n    trusted = SimpleNamespace(source="cdp", cookies_file="")\n    trusted_dom = SimpleNamespace(source="cdp-dom", cookies_file="")\n    untrusted = SimpleNamespace(source="js-blob", cookies_file="")\n    assert _trusted_googlevideo_candidate(trusted) is True\n    assert _trusted_googlevideo_candidate(trusted_dom) is True\n    assert _trusted_googlevideo_candidate(untrusted) is False\n''',
              1,
          )
          tests = tests.replace(
              'from app.extractor import DownloadError, MediaCandidate, UniversalExtractor, _browser_capture_url\n',
              'from app.extractor import DownloadError, MediaCandidate, UniversalExtractor, _browser_capture_url, _hint_height\n',
              1,
          )
          addition = '''\n\ndef test_itag_height_mapping_is_used_for_browser_candidates():\n    assert _hint_height("https://r.example.googlevideo.com/videoplayback?itag=22") == 720\n    assert _hint_height("https://r.example.googlevideo.com/videoplayback?itag=137") == 1080\n\n\ndef test_direct_stream_is_consumed_before_context_closes(monkeypatch, tmp_path):\n    class Response:\n        headers = {"content-type": "video/mp4", "content-length": "16"}\n        closed = False\n\n        def __enter__(self):\n            return self\n\n        def __exit__(self, *args):\n            self.closed = True\n\n        def raise_for_status(self):\n            return None\n\n        def iter_bytes(self, size):\n            assert self.closed is False\n            yield b"\\x00\\x00\\x00\\x18ftypisom0000"\n\n    response = Response()\n    monkeypatch.setattr(extractor_module.httpx, "stream", lambda *args, **kwargs: response)\n    candidate = MediaCandidate(\n        "https://cdn.example/video.mp4", "direct", "cdp", title="video"\n    )\n    extractor = UniversalExtractor(use_browser=False)\n    result = extractor._download_candidate(candidate, tmp_path, "https://youtube.com/watch?v=x")\n    assert Path(result["path"]).read_bytes().startswith(b"\\x00\\x00\\x00\\x18ftyp")\n'''
          if "test_direct_stream_is_consumed_before_context_closes" not in tests:
              tests += addition
          tests_path.write_text(tests, encoding="utf-8")
          PY
      - name: Verify complete release gate
        run: |
          pip install -r requirements.txt pip-audit
          pip-audit -r requirements.txt
          PYTHONPATH=. pytest -q
          PYTHONPATH=. python -m compileall -q app scripts
          docker build --tag yjdownload:googlevideo-stream-gate .
      - name: Commit verified repair directly to main
        shell: bash
        run: |
          rm -f .github/direct-googlevideo-stream-repair-trigger
          rm -f .github/workflows/direct-googlevideo-stream-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stream trusted browser media correctly"
          git push origin HEAD:main
