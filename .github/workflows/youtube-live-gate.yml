name: YouTube Live Gate

on:
  push:
    branches:
      - main
    paths:
      - .github/youtube-live-gate-trigger

permissions:
  contents: write

jobs:
  youtube-live:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install live-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install httpx==0.28.1
      - name: Wait for exact Render SHA and enabled fallback
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ["GITHUB_SHA"]
          deadline = time.time() + 900
          while time.time() < deadline:
              try:
                  url = f"https://yjvideodownloads.onrender.com/health?sha={expected[:12]}&t={int(time.time())}"
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
                  print(data.get("gitSha"), data.get("publicYoutubeFallbackEnabled"))
                  if (data.get("ok") and data.get("gitSha") == expected
                          and data.get("publicYoutubeFallbackEnabled")
                          and data.get("ffmpegReady") and data.get("javascriptRuntimeReady")):
                      raise SystemExit(0)
              except Exception as exc:
                  print(type(exc).__name__)
              time.sleep(10)
          raise SystemExit("Render did not reach exact YouTube gate SHA")
          PY
      - name: Test both supplied YouTube URLs
        shell: bash
        run: |
          set +e
          python scripts/acceptance_media.py \
            --base-url https://yjvideodownloads.onrender.com \
            --timeout 900 \
            --json docs/youtube-live-latest.json \
            "https://youtu.be/kTRs4ycFp_o?si=1T_A4IsWT8fxnkce" \
            "https://youtube.com/shorts/T7DA7VTZ_Zs?si=1F9UnPcRym93-Tyu" \
            > youtube-live.log 2>&1
          echo "$?" > youtube-live.exit
          tail -n 180 youtube-live.log || true
          exit 0
      - name: Write compact YouTube report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/youtube-live-latest.json")
          lines = ["# YouTube live acceptance", ""]
          if not path.exists():
              lines += ["Overall: **FAIL**", "", "No JSON report was generated."]
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              lines += [f"Overall: **{'PASS' if report.get('ok') else 'FAIL'}**", ""]
              for index, item in enumerate(report.get("results", []), start=1):
                  lines.append(f"## YouTube sample {index}")
                  inspected = item.get("inspect") or {}
                  lines.append(f"Inspection: **{'PASS' if inspected.get('ok') else 'FAIL'}**")
                  lines.append(f"Formats: `{[f.get('id') for f in inspected.get('formats', [])]}`")
                  if not inspected.get("ok"):
                      lines.append(f"- `{str(inspected.get('error', ''))[:260]}`")
                  for quality in item.get("qualities", []):
                      key = quality.get("requested_quality")
                      if quality.get("ok"):
                          lines.append(
                              f"- `{key}`: **PASS** — video={quality.get('has_video')}, "
                              f"audio={quality.get('has_audio')}, height={quality.get('height')}, "
                              f"bytes={quality.get('bytes')}"
                          )
                      else:
                          lines.append(
                              f"- `{key}`: **FAIL** [{quality.get('classification')}] "
                              f"`{str(quality.get('error', ''))[:260]}`"
                          )
                  lines.append("")
          Path("docs/youtube-live-latest.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Persist report and remove temporary gate
        shell: bash
        run: |
          rm -f .github/youtube-live-gate-trigger
          rm -f .github/workflows/youtube-live-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: record YouTube live acceptance"
          git push origin HEAD:main
