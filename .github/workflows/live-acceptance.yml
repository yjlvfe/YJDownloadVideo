name: Live Media Acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install httpx==0.28.1
      - name: Run all supplied URLs and advertised qualities
        shell: bash
        run: |
          set -o pipefail
          python scripts/acceptance_media.py \
            --base-url https://yjvideodownloads.onrender.com \
            --timeout 1200 \
            --json live-acceptance.json \
            2>&1 | tee live-acceptance.log
      - name: Upload live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-report
          path: |
            live-acceptance.json
            live-acceptance.log
          if-no-files-found: ignore
          retention-days: 7
